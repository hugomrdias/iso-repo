packages:
  - 'packages/*'
  - 'examples/*'

blockExoticSubdeps: true

allowBuilds:
  better-sqlite3: true
  cbor-extract: false
  esbuild: true
  keccak: false
  msw: true
  sharp: true
  simple-git-hooks: true
  workerd: true

catalog:
  '@biomejs/biome': ^2.5.14
  '@noble/ed25519': ^3.2.0
  '@noble/hashes': ^2.4.0
  '@standard-schema/spec': ^1.1.0
  '@standard-schema/utils': ^0.3.0
  '@types/assert': ^1.5.11
  '@types/debug': ^4.1.13
  '@types/mocha': ^10.0.10
  '@types/node': ^26.6.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.1
  assert: ^2.1.0
  delay: ^7.0.0
  globals: ^17.12.0
  hono: ^4.13.9
  mocha: ^12.0.2
  msw: 2.14.6
  multiformats: ^14.0.5
  playwright-test: ^15.0.1
  react: ^19.3.0
  react-dom: ^19.3.0
  tempy: ^3.2.0
  type-fest: ^5.10.0
  typescript: ^6.0.3
  viem: ~2.54.6
  vite: ^8.3.1
  wrangler: ^4.141.0
  zod: ^4.6.5

minimumReleaseAgeExclude:
  - playwright-test@15.0.1
