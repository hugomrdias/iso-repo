name: iso-ledger
env:
  CI: true
  FORCE_COLOR: 1
on:
  push:
    branches:
      - main
    paths:
      - "packages/iso-ledger/**"
      - .github/workflows/iso-ledger.yml
      - pnpm-lock.yaml
  pull_request:
    paths:
      - "packages/iso-ledger/**"
      - .github/workflows/iso-ledger.yml
      - pnpm-lock.yaml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm run build
      - run: pnpm -r --filter iso-ledger run lint
      - run: pnpm -r --filter iso-ledger exec depcheck
