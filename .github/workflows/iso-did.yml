name: iso-did
env:
  CI: true
  FORCE_COLOR: 1
on:
  push:
    branches:
      - main
    paths:
      - 'packages/iso-did/**'
      - .github/workflows/iso-did.yml
      - pnpm-lock.yaml
  pull_request:
    paths:
      - 'packages/iso-did/**'
      - .github/workflows/iso-did.yml
      - pnpm-lock.yaml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm run build
      - run: pnpm -r --filter iso-did run lint
      - run: pnpm -r --filter iso-did run test
      - run: pnpm -r --filter iso-did exec depcheck
